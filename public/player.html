<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>實驗室入口｜P.A.N.D.E.M.I.C.</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="player"><header class="top"><p class="eyebrow">LABORATORY TERMINAL</p><h1>P.A.N.D.E.M.I.C.<br>收容協議</h1><p class="status" id="notice"></p></header>
<section class="join panel" id="join"><h2>登錄實驗室</h2><input id="name" maxlength="16" placeholder="輸入你的實驗室名稱或暱稱"><button class="btn" id="joinBtn">加入收容網路</button><p class="error" id="error"></p></section>
<section id="game" hidden><article class="personal panel"><p class="mono" id="labname"></p><div class="big-score" id="score"></div><p>預估安全指數　<span class="resource" id="resources"></span></p><h2>已收容樣本</h2><div id="samples"></div></article><article id="decision" class="decision" hidden></article><div id="waiting" class="waiting"></div><section id="finalResult" class="panel" hidden></section></section>
</main><script src="/app.js"></script><script>
let id=localStorage.getItem('pandemic-player-id'),choices={},choiceKey='';
const joinPanel=$('#join'),gamePanel=$('#game'),nameInput=$('#name'),joinButton=$('#joinBtn'),errorBox=$('#error');
joinButton.onclick=async()=>{try{const data=await post('/api/join',{name:nameInput.value});localStorage.setItem('pandemic-player-id',data.id);id=data.id;errorBox.textContent='';showGame()}catch(error){errorBox.textContent=error.message}};
function showGame(){joinPanel.hidden=true;gamePanel.hidden=false} if(id)showGame();
function drawDecision(markets){const key=markets.map(m=>m.id).join('-');if(key!==choiceKey){choiceKey=key;choices=Object.fromEntries(markets.map(m=>[m.id,'decline']))}const decision=$('#decision');decision.hidden=false;decision.innerHTML=`<h3>本輪收容決策</h3><p>可同時申請多張樣本；無人申請的樣本，所有人各扣 1 點並累積進拒絕池。</p>${markets.map(m=>`<button class="choice ${choices[m.id]==='accept'?'selected':''}" onclick="toggle(${m.id})"><span>市場 ${String.fromCharCode(64+m.id)}　${esc(m.sample.typeLabel)} ${esc(m.sample.code)} <b>−${m.sample.risk}</b></span><small>${choices[m.id]==='accept'?'申請收容':'拒絕'}</small></button>`).join('')}<button class="btn submit" onclick="submitChoices()">送出加密決策</button>`}
function toggle(marketId){choices[marketId]=choices[marketId]==='accept'?'decline':'accept';drawDecision(latest.markets.filter(m=>m.status==='active'))}
async function submitChoices(){try{await post('/api/submit',{playerId:id,actions:choices})}catch(error){alert(error.message)}}
watch(state=>{latest=state;$('#notice').textContent=state.notice;if(!id)return;const player=state.players.find(item=>item.id===id);if(!player){localStorage.removeItem('pandemic-player-id');id=null;joinPanel.hidden=false;gamePanel.hidden=true;return}$('#labname').textContent=player.name;$('#score').textContent=`${player.score} 分`;$('#resources').textContent=`◎ ${player.resources} 點隔離點數`;$('#samples').innerHTML=sampleChips(player.samples);const decision=$('#decision'),waiting=$('#waiting'),active=state.markets.filter(m=>m.status==='active');decision.hidden=true;waiting.textContent='';if(state.phase==='active'&&active.length){if(player.submitted)waiting.textContent=`決策已加密送出。正在等待其他實驗室（${state.submissionCount}／${state.playerCount}）。`;else drawDecision(active)}else if(state.phase==='active')waiting.textContent='正在結算市場。';else waiting.textContent=state.phase==='lobby'?'等待主持人啟動收容協議。':state.phase==='identity'?'請閱讀並確認你的私密身份。':state.phase==='final'?'本局已完成結算。':'本回合已結束，等待下一輪。';const result=$('#finalResult');if(state.result){result.hidden=false;const mine=state.result.scores.find(x=>x.id===id);result.innerHTML=`<h2>${state.result.winningFaction==='evil'?'反收容派勝利':'收容協議成功'}</h2><p>最終失控指數：${state.outbreak}</p><p>你的最終分數：<b>${mine?.total ?? player.score}</b>（基礎 ${mine?.base ?? player.score} ＋ 陣營獎勵 ${mine?.bonus ?? 0}）</p>`}else result.hidden=true;});
</script></body></html>
