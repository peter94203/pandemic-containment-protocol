<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>實驗室入口｜P.A.N.D.E.M.I.C.</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="player">
    <header class="top">
      <p class="eyebrow">LABORATORY TERMINAL</p>
      <h1>P.A.N.D.E.M.I.C.<br>收容協議</h1>
      <p class="status" id="notice"></p>
    </header>
    <section class="join panel" id="join">
      <h2>登錄實驗室</h2>
      <input id="name" maxlength="16" placeholder="輸入你的實驗室名稱或暱稱">
      <button class="btn" id="joinBtn">加入收容網路</button>
      <p class="error" id="error"></p>
    </section>
    <section id="game" hidden>
      <article class="personal panel">
        <p class="mono" id="labname"></p>
        <div class="big-score" id="score"></div>
        <p>預估安全指數　<span class="resource" id="resources"></span></p>
        <h2>已收容樣本</h2>
        <div id="samples"></div>
      </article>
      <article id="decision" class="decision" hidden></article>
      <div id="waiting" class="waiting"></div>
    </section>
  </main>
  <script src="/app.js"></script>
  <script>
    let id = localStorage.getItem('pandemic-player-id');
    const joinPanel = $('#join');
    const gamePanel = $('#game');
    const nameInput = $('#name');
    const joinButton = $('#joinBtn');
    const errorBox = $('#error');

    joinButton.onclick = async () => {
      try {
        const data = await post('/api/join', { name: nameInput.value });
        localStorage.setItem('pandemic-player-id', data.id);
        id = data.id;
        errorBox.textContent = '';
        showGame();
      } catch (error) {
        errorBox.textContent = error.message;
      }
    };

    function showGame() {
      joinPanel.hidden = true;
      gamePanel.hidden = false;
    }

    if (id) showGame();

    watch((state) => {
      $('#notice').textContent = state.notice;
      if (!id) return;
      const player = state.players.find((item) => item.id === id);
      if (!player) {
        localStorage.removeItem('pandemic-player-id');
        id = null;
        joinPanel.hidden = false;
        gamePanel.hidden = true;
        return;
      }
      $('#labname').textContent = player.name;
      $('#score').textContent = `${player.score} 分`;
      $('#resources').textContent = `◎ ${player.resources} 點隔離資源`;
      $('#samples').innerHTML = sampleChips(player.samples);

      const decision = $('#decision');
      const waiting = $('#waiting');
      const market = state.markets.find((item) => item.id === player.market);
      decision.hidden = true;
      waiting.textContent = '';
      if (state.phase === 'active' && market) {
        if (market.currentPlayerId === id) {
          decision.hidden = false;
          decision.innerHTML = `<h3>輪到你決策</h3><p>是否收容 <b>${esc(market.sample.code)}（−${market.sample.risk}）</b>？目前拒絕池有 <b>${market.pot}</b> 點資源。</p><div class="actions"><button class="btn decline" onclick="act('decline')">拒絕<br><small>支付 1 點資源</small></button><button class="btn" onclick="act('accept')">收容樣本<br><small>取得拒絕池</small></button></div>`;
        } else {
          waiting.textContent = `市場 ${player.market} 正在等待 ${market.currentPlayerName} 決策。`;
        }
      } else if (state.phase === 'active') {
        waiting.textContent = '本輪你的市場已結算，請等待其他市場完成。';
      } else {
        waiting.textContent = state.phase === 'lobby' ? '等待主持人啟動收容協議。' : '本回合已結算，請等待下一輪。';
      }
    });

    async function act(action) {
      try {
        await post('/api/decision', { playerId: id, action });
      } catch (error) {
        alert(error.message);
      }
    }
  </script>
</body>
</html>
