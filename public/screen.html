<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全場儀表板｜P.A.N.D.E.M.I.C.</title><link rel="stylesheet" href="/style.css"></head><body><main class="app screen projection"><header class="top"><div><p class="eyebrow">GLOBAL CONTAINMENT NETWORK</p><h1>P.A.N.D.E.M.I.C. 收容協議 <span class="mono" id="round"></span></h1></div><div><p class="status" id="timer"></p><p class="status" id="notice"></p></div></header><div class="projection-meta"><span id="outbreak"></span><span id="modeLabel"></span></div><section id="projectionBoard"></section></main><script src="/app.js"></script><script>
let screenState=null,mode='summary',page=0;
function finalBoard(s){return `<section class="panel final-board"><h2>${s.result.winningFaction==='evil'?'反收容派勝利':'收容協議成功'}</h2><p>最終失控指數：${s.outbreak}</p>${s.result.scores.map((p,i)=>`<div class="final-row"><b>#${i+1}</b><strong>${esc(p.name)}</strong><span>${p.faction==='evil'?'反收容派':'收容協議研究員'}｜${esc(p.role)}</span><span class="score">${p.total} 分</span></div>`).join('')}</section>`}
function summary(s){return `<section class="projection-markets"><div class="markets">${s.markets.map(m=>`<article class="market panel ${m.sample.naturalMutation?'mutation-market':''} ${m.sample.sabotaged?'sabotage-market':''}"><div class="market-head">市場 ${String.fromCharCode(64+m.id)}</div><div class="mono">${esc(m.sample.typeLabel)}</div><div class="sample">${esc(m.sample.code)} <span class="risk">−${m.sample.risk}</span></div><div class="pot">拒絕池：${m.pot}</div></article>`).join('')}</div></section><section class="panel projection-roster"><h2>全員排名（${s.players.length} 人）</h2><div class="roster-grid">${s.players.map((p,i)=>`<div class="roster-row"><b>#${i+1}</b><strong>${esc(p.name)}</strong><span>卡 ${p.sampleCount}</span><span class="resource">◎${p.resources}</span><span class="score">${p.score}</span></div>`).join('')}</div></section>`}
function inventory(s){const size=9,pages=Math.max(1,Math.ceil(s.players.length/size)),start=page*size;return `<section class="panel inventory"><h2>收容樣本清冊｜${page+1}/${pages}</h2><div class="inventory-grid">${s.players.slice(start,start+size).map((p,i)=>`<article class="inventory-player"><b>#${start+i+1} ${esc(p.name)}</b>${sampleChips(p.samples)}</article>`).join('')}</div></section>`}
function render(){if(!screenState)return;const s=screenState;if(s.result){modeLabel.textContent='最終結算';outbreak.textContent='';timer.textContent='';projectionBoard.innerHTML=finalBoard(s);return}round.textContent=s.round?`// ROUND ${s.round}`:'';notice.textContent=s.notice;outbreak.textContent=`失控指數：${s.outbreak} ／ 10`;modeLabel.textContent=mode==='summary'?'市場與全員排名':'完整樣本清冊';projectionBoard.innerHTML=mode==='summary'?summary(s):inventory(s)}watch(s=>{screenState=s;render()});setInterval(()=>{if(!screenState||screenState.result)return;const pages=Math.ceil(screenState.players.length/9)||1;if(mode==='summary'){mode='inventory';page=0}else if(page<pages-1)page++;else mode='summary';render()},8000);setInterval(()=>{timer.textContent=screenState?.decisionDeadline?`倒數：${Math.max(0,Math.ceil((screenState.decisionDeadline-Date.now())/1000))} 秒`:''},250);
</script></body></html>
