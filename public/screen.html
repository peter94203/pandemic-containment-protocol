<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全場儀表板｜P.A.N.D.E.M.I.C.</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="app screen projection"><header class="top"><div><p class="eyebrow">GLOBAL CONTAINMENT NETWORK</p><h1>P.A.N.D.E.M.I.C. 收容協議 <span class="mono" id="round"></span></h1></div><div><p class="status" id="timer"></p><p class="status" id="notice"></p></div></header><div class="projection-meta"><span id="outbreak"></span><span id="modeLabel"></span></div><section class="panel error" id="reveal" hidden></section><section id="projectionBoard"></section><section class="panel" id="result" hidden></section></main>
<script src="/app.js"></script><script>
let screenState=null,projectionMode='summary',inventoryPage=0;
function renderSummary(s){return `<section class="projection-markets"><h2>本輪平行收容市場</h2><div class="markets">${s.markets.map(m=>{const flags=[m.sample.noReduction?'⚠變異／不可減傷':'',m.sample.locked?'🔒鎖定／不可消除':''].filter(Boolean).join(' ');return `<article class="market panel ${m.status}"><div class="market-head"><span>市場 ${String.fromCharCode(64+m.id)}</span><span>${m.status==='active'?'開放中':'已收容'}</span></div><div class="mono">${esc(m.sample.typeLabel)}樣本</div><div class="sample">${esc(m.sample.code)} <span class="risk">−${m.sample.risk}</span></div>${flags?`<div class="error">${flags}</div>`:''}<div class="pot">拒絕池：${m.pot}</div><div class="turn">${m.status==='active'?'等待決策':`收容者：${esc(m.winnerName)}`}</div></article>`}).join('')}</div></section><section class="panel projection-roster"><h2>全員即時排名 <small>（${s.players.length} 人）</small></h2><div class="roster-grid">${s.players.map((p,i)=>`<div class="roster-row"><b>#${i+1}</b><strong>${esc(p.name)}</strong><span class="mono">卡 ${p.sampleCount}</span><span class="resource">◎${p.resources}</span><span class="score">${p.score}</span>${p.revealed?'<span class="reveal-dot">公開</span>':''}</div>`).join('')}</div></section>`}
function renderInventory(s){const pageSize=9,pages=Math.max(1,Math.ceil(s.players.length/pageSize)),start=inventoryPage*pageSize,players=s.players.slice(start,start+pageSize);return `<section class="panel inventory"><h2>收容樣本清冊 <small>第 ${inventoryPage+1}／${pages} 頁｜完整卡牌資料</small></h2><div class="inventory-grid">${players.map((p,i)=>`<article class="inventory-player"><div><b>#${start+i+1} ${esc(p.name)}</b><span class="resource">◎${p.resources}</span><span class="score">${p.score}</span></div>${sampleChips(p.samples)}</article>`).join('')}</div></section>`}
function renderProjection(){if(!screenState)return;const s=screenState,pages=Math.max(1,Math.ceil(s.players.length/9));if(inventoryPage>=pages)inventoryPage=0;round.textContent=s.round?`// ROUND ${String(s.round).padStart(2,'0')}`:'';notice.textContent=s.notice;outbreak.textContent=`失控指數：${s.outbreak} ／ 10`;reveal.hidden=!s.revealAnnouncement;reveal.textContent=s.revealAnnouncement||'';modeLabel.textContent=projectionMode==='summary'?'市場與全員排名':'完整收容樣本清冊';projectionBoard.innerHTML=projectionMode==='summary'?renderSummary(s):renderInventory(s);result.hidden=!s.result;if(s.result)result.innerHTML=`<h2>${s.result.winningFaction==='evil'?'反收容派勝利':'收容協議成功'}</h2><p>最終失控指數：${s.outbreak}</p>`}
watch(s=>{screenState=s;renderProjection()});
setInterval(()=>{if(!screenState)return;const pages=Math.max(1,Math.ceil(screenState.players.length/9));if(projectionMode==='summary'){projectionMode='inventory';inventoryPage=0}else if(inventoryPage<pages-1){inventoryPage+=1}else projectionMode='summary';renderProjection()},8000);
setInterval(()=>{timer.textContent=screenState?.decisionDeadline?`本次決策倒數：${Math.max(0,Math.ceil((screenState.decisionDeadline-Date.now())/1000))} 秒`:''},250);
</script></body></html>
