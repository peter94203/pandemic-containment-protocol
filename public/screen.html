<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全場儀表板｜P.A.N.D.E.M.I.C.</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="app screen"><header class="top"><div><p class="eyebrow">GLOBAL CONTAINMENT NETWORK</p><h1>P.A.N.D.E.M.I.C. 收容協議 <span class="mono" id="round"></span></h1></div><p class="status" id="notice"></p></header><p class="host-note" id="outbreak"></p><p class="status" id="timer"></p><section class="panel error" id="reveal" hidden></section><div class="grid"><section><h2>平行收容市場</h2><div class="markets" id="markets"></div></section><aside class="panel rankings"><h2>全球實驗室排名</h2><div id="ranking"></div></aside></div><section class="panel" id="result" hidden></section></main><script src="/app.js"></script><script>let screenState=null;watch(s=>{screenState=s;round.textContent=s.round?`// ROUND ${String(s.round).padStart(2,'0')}`:'';notice.textContent=s.notice;outbreak.textContent=`失控指數：${s.outbreak} ／ 10`;reveal.hidden=!s.revealAnnouncement;reveal.textContent=s.revealAnnouncement||'';renderMarkets(s,markets);renderRanking(s,ranking);result.hidden=!s.result;if(s.result)result.innerHTML=`<h2>${s.result.winningFaction==='evil'?'反收容派勝利':'收容協議成功'}</h2><p>最終失控指數：${s.outbreak}</p>`});setInterval(()=>{timer.textContent=screenState?.decisionDeadline?`本次決策倒數：${Math.max(0,Math.ceil((screenState.decisionDeadline-Date.now())/1000))} 秒`:''},250);</script></body></html>
