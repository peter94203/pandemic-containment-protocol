<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全場儀表板｜P.A.N.D.E.M.I.C.</title><link rel="stylesheet" href="/style.css"></head><body><main class="app screen projection"><header class="top"><div><p class="eyebrow">GLOBAL CONTAINMENT NETWORK</p><h1>P.A.N.D.E.M.I.C. 收容協議 <span class="mono" id="round"></span></h1></div><div><p class="status" id="timer"></p><p class="status" id="notice"></p></div></header><div class="projection-meta"><span id="outbreak"></span><span id="modeLabel"></span></div><section id="outbreakFeed"></section><section id="projectionBoard"></section></main><script src="/app.js"></script><script>
let screenState=null,mode='summary',page=0;
function achievementList(items){return items?.length?`<div class="chips">${items.map(a=>`<span class="chip" style="border-color:#ffd166;color:#fff0bb">★ ${esc(a.title)} +${a.points}</span>`).join('')}</div>`:''}
function renderOutbreakFeed(s){const feed=s.outbreakEvents||[];document.querySelector('#outbreakFeed').innerHTML=feed.length?`<section class="panel" style="margin:14px 0;border:2px solid #f5b942"><h2 style="margin:0 0 8px">失控指數異動紀錄</h2>${feed.slice(0,4).map(e=>`<div style="padding:6px 0;border-top:1px solid #31584d"><b style="color:${e.amount<0?'#70f5b1':'#ff8897'}">${e.amount>0?'+':''}${e.amount}</b>　${esc(e.reason)}</div>`).join('')}</section>`:''}
function finalBoard(s){return `<section class="panel final-board"><h2>${s.result.winningFaction==='evil'?'反收容派勝利':'收容協議成功'}</h2><p>最終失控指數：${s.outbreak}</p>${s.result.scores.map((p,i)=>`<div class="final-row"><b>#${i+1}</b><strong>${esc(p.name)}</strong><span>${p.faction==='evil'?'反收容派':'收容協議研究員'}｜${esc(p.role)}</span><span class="score">${p.total} 分</span>${achievementList(p.achievements)}</div>`).join('')}</section>`}
function achievementBoard(s){const earned=s.players.flatMap(p=>(p.achievements||[]).map(a=>({...a,name:p.name})));return `<section class="panel" style="margin-top:14px"><h2>全場成就</h2>${earned.length?earned.map(a=>`<span class="chip" style="margin:3px;border-color:#ffd166;color:#fff0bb">★ ${esc(a.name)}｜${esc(a.title)} +${a.points}</span>`).join(''):'<p class="waiting">尚未有玩家達成成就。</p>'}</section>`}
function summary(s){return `<section class="projection-markets"><div class="markets">${s.markets.map(m=>{const style=m.sample.naturalMutation?'border:3px solid #d948ff;background:#3b1048;box-shadow:0 0 18px #d948ff88':m.sample.sabotaged?'border:3px solid #ff667a;background:#49101a':'';return `<article class="market panel" style="${style}"><div class="market-head">市場 ${String.fromCharCode(64+m.id)}</div><div class="mono">${esc(m.sample.typeLabel)}</div><div class="sample">${esc(m.sample.code)} <span class="risk">−${m.sample.risk}</span></div>${m.sample.naturalMutation?'<div class="error">☣ 天然突變</div>':''}${m.sample.sabotaged?'<div class="error">⚠ 內部破壞</div>':''}<div class="pot">拒絕池：${m.pot}</div></article>`}).join('')}</div></section><section class="panel projection-roster"><h2>全員排名（${s.players.length} 人）</h2><div class="roster-grid">${s.players.map((p,i)=>`<div class="roster-row"><b>#${i+1}</b><strong>${esc(p.name)}</strong><span>卡 ${p.sampleCount}</span><span class="resource">◎${p.resources}</span><span class="score">${p.score}</span></div>`).join('')}</div></section>${achievementBoard(s)}`}
function inventory(s){const size=9,pages=Math.max(1,Math.ceil(s.players.length/size)),start=page*size;return `<section class="panel inventory"><h2>收容樣本清冊｜${page+1}/${pages}</h2><div class="inventory-grid">${s.players.slice(start,start+size).map((p,i)=>`<article class="inventory-player"><b>#${start+i+1} ${esc(p.name)}</b>${sampleChips(p.samples)}${achievementList(p.achievements)}</article>`).join('')}</div></section>`}
function render(){if(!screenState)return;const s=screenState;if(s.result){modeLabel.textContent='最終結算';outbreak.textContent='';timer.textContent='';renderOutbreakFeed(s);projectionBoard.innerHTML=finalBoard(s);return}round.textContent=s.round?`// ROUND ${s.round}`:'';notice.textContent=s.notice;outbreak.textContent=`失控指數：${s.outbreak} ／ 10`;modeLabel.textContent=mode==='summary'?'市場與全員排名':'完整樣本清冊';renderOutbreakFeed(s);projectionBoard.innerHTML=mode==='summary'?summary(s):inventory(s)}watch(s=>{screenState=s;render()});setInterval(()=>{if(!screenState||screenState.result)return;const pages=Math.ceil(screenState.players.length/9)||1;if(mode==='summary'){mode='inventory';page=0}else if(page<pages-1)page++;else mode='summary';render()},8000);setInterval(()=>{timer.textContent=screenState?.decisionDeadline?`倒數：${Math.max(0,Math.ceil((screenState.decisionDeadline-Date.now())/1000))} 秒`:''},250);
</script></body></html>
