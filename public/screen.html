<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全場儀表板｜P.A.N.D.E.M.I.C.</title><link rel="stylesheet" href="/style.css"></head><body><main class="app screen projection"><header class="top"><div><p class="eyebrow">GLOBAL CONTAINMENT NETWORK</p><h1>P.A.N.D.E.M.I.C. 收容協議 <span class="mono" id="round"></span></h1></div><div><p class="status" id="timer"></p><p class="status" id="notice"></p></div></header><div class="projection-meta"><span id="outbreak"></span><span id="modeLabel"></span></div><section id="outbreakFeed"></section><section id="projectionBoard"></section></main><script src="/app.js"></script><script>
let screenState=null,previousPhase='';
function achievementConditions(){return `<section class="panel" style="margin-top:14px"><h2>本局成就挑戰</h2><div class="chips"><span class="chip" style="border-color:#ffd166;color:#fff0bb">★ 突變雙重收容｜同一大回合收容 2 張天然突變樣本｜+20</span><span class="chip" style="border-color:#ffd166;color:#fff0bb">★ 零殘留收容｜結算時所有持有樣本均已消除，且曾收容 5 張以上｜+100</span><span class="chip" style="border-color:#ffd166;color:#fff0bb">★ 高效收容網｜結算時未消除樣本少於 2 張，且曾收容 10 張以上｜+250</span></div></section>`}
function renderOutbreakFeed(s){const feed=s.outbreakEvents||[];document.querySelector('#outbreakFeed').innerHTML=feed.length?`<section class="panel" style="margin:14px 0;border:2px solid #f5b942"><h2 style="margin:0 0 8px">失控指數異動紀錄</h2>${feed.slice(0,4).map(e=>`<div style="padding:6px 0;border-top:1px solid #31584d"><b style="color:${e.amount<0?'#70f5b1':'#ff8897'}">${e.amount>0?'+':''}${e.amount}</b>　${esc(e.reason)}</div>`).join('')}</section>`:''}
function finalBoard(s){return `<section class="panel final-board"><h2>${s.result.winningFaction==='evil'?'狂人陣營勝利':'研究員陣營勝利'}</h2><p>最終失控指數：${s.outbreak}</p>${s.result.scores.map((p,i)=>`<div class="final-row"><b>#${i+1}</b><strong>${esc(p.name)}</strong><span>${p.faction==='evil'?'狂人陣營':'研究員陣營'}｜${esc(p.role)}</span><span>舉報 ${p.reports || 0}／9</span><span class="score">${p.total} 分</span></div>`).join('')}</section>${achievementConditions()}`}
function summary(s){return `<section class="projection-markets"><div class="markets">${s.markets.map(m=>{const hidden=m.sample.hiddenType,style=m.sample.naturalMutation?'border:3px solid #d948ff;background:#3b1048;box-shadow:0 0 18px #d948ff88':m.sample.sabotaged?'border:3px solid #ff667a;background:#49101a':'';return `<article class="market panel" style="${style}"><div class="market-head">病原體分配所 ${String.fromCharCode(64+m.id)}</div><div class="mono">${hidden?'機密樣本':`${esc(m.sample.typeLabel)}樣本`}</div><div class="sample">${esc(m.sample.code)} ${hidden?'<span class="risk">危險係數：機密</span>':`<span class="risk">−${m.sample.risk}</span>`}</div>${m.sample.naturalMutation?'<div class="error">☣ 天然突變</div>':''}${m.sample.sabotaged?'<div class="error">⚠ 內部破壞</div>':''}<div class="pot">拒絕池：${m.pot}</div>${m.status==='sold'?`<div class="turn">樣本歸屬：${esc(m.winnerName)}</div>`:'<div class="turn">等待分配</div>'}</article>`}).join('')}</div></section><section class="panel projection-roster"><h2>全員排名（${s.players.length} 人）</h2><div class="roster-grid">${s.players.map((p,i)=>`<div class="roster-row"><b>#${i+1}</b><strong>${esc(p.name)}</strong><span>樣本 ${p.sampleCount}</span><span>舉報 ${p.reports || 0}／9</span><span class="resource">◎${p.resources}</span><span class="score">${p.score}</span></div>`).join('')}</div></section>${achievementConditions()}`}
function render(){if(!screenState)return;const s=screenState;if(s.result){modeLabel.textContent='最終結算';outbreak.textContent='';timer.textContent='';renderOutbreakFeed(s);projectionBoard.innerHTML=finalBoard(s);return}round.textContent=s.round?`// ROUND ${s.round}`:'';notice.textContent=s.notice;outbreak.textContent=`失控指數：${s.outbreak} ／ 10`;modeLabel.textContent='病原體分配所與全員排名';renderOutbreakFeed(s);projectionBoard.innerHTML=summary(s)}watch(s=>{previousPhase=s.phase;screenState=s;render()});setInterval(()=>{timer.textContent=screenState?.decisionDeadline?`倒數：${Math.max(0,Math.ceil((screenState.decisionDeadline-Date.now())/1000))} 秒`:''},250);
</script></body></html>
