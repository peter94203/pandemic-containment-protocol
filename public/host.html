<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主持人控制台｜P.A.N.D.E.M.I.C.</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="app"><header class="top"><div><p class="eyebrow">HOST CONSOLE</p><h1>P.A.N.D.E.M.I.C. 收容協議</h1></div><p class="status" id="notice"></p></header>
<section class="host-controls"><label class="mono">每種樣本數 <input id="samplesPerType" type="number" min="3" max="99" value="25" style="width:72px"></label><label class="mono">每次決策秒數 <input id="decisionSeconds" type="number" min="10" max="600" value="60" style="width:72px"></label><button class="btn" id="saveConfig">儲存本場設定</button><button class="btn" id="start">發放身份／開啟下一回合</button><button class="btn danger" id="forceResolve" hidden>立刻結算本次決策</button><button class="btn danger" id="reset">重置整場遊戲</button></section><p class="status" id="timer"></p>
<p class="host-note">先讓所有玩家登入，再設定每種樣本數與決策秒數並儲存。狂人陣營人數會依玩家數自動分配：每 4 位玩家 1 名（例如 5～8 人為 2 名）。第一次按「發放身份／開啟下一回合」只會私下發放陣營與身份；全員確認後再按一次，才會開啟第一輪五個病原體分配所。</p>
<div class="grid"><section><h2>病原體分配所</h2><div class="markets" id="markets"></div></section><aside class="panel rankings"><h2>即時安全排名</h2><div id="ranking"></div></aside></div></main>
<script src="/app.js"></script><script>
const notice=$('#notice'),markets=$('#markets'),ranking=$('#ranking'),startButton=$('#start'),resetButton=$('#reset'),saveConfig=$('#saveConfig'),samplesPerType=$('#samplesPerType'),decisionSeconds=$('#decisionSeconds'),forceResolve=$('#forceResolve'),timer=$('#timer');let hostState=null;
watch(s=>{hostState=s;notice.textContent=s.notice;renderMarkets(s,markets);renderRanking(s,ranking);forceResolve.hidden=s.phase!=='active';if(s.phase!=='lobby'){samplesPerType.disabled=true;decisionSeconds.disabled=true;saveConfig.disabled=true}});
setInterval(()=>{if(!hostState?.decisionDeadline){timer.textContent='';return}timer.textContent=`本次決策剩餘 ${Math.max(0,Math.ceil((hostState.decisionDeadline-Date.now())/1000))} 秒`},250);
async function hostPost(path,body={}){let key=localStorage.getItem('pandemic-host-key');if(!key){key=prompt('請輸入主持人密鑰');if(!key)return;localStorage.setItem('pandemic-host-key',key)}return post(path,body,{'X-Host-Key':key})}
saveConfig.onclick=async()=>{try{await hostPost('/api/host/config',{samplesPerType:Number(samplesPerType.value),decisionSeconds:Number(decisionSeconds.value)})}catch(e){if(e.message.includes('密鑰'))localStorage.removeItem('pandemic-host-key');alert(e.message)}};
startButton.onclick=async()=>{try{await hostPost('/api/host/start')}catch(e){if(e.message.includes('密鑰'))localStorage.removeItem('pandemic-host-key');alert(e.message)}};
resetButton.onclick=async()=>{if(!confirm('確定重置所有樣本與隔離點數？'))return;try{await hostPost('/api/host/reset')}catch(e){if(e.message.includes('密鑰'))localStorage.removeItem('pandemic-host-key');alert(e.message)}};
forceResolve.onclick=async()=>{if(!confirm('確定立刻結算？尚未送出者會全部拒絕，且研究員陣營失去本回合舉報資格。'))return;try{await hostPost('/api/host/force-resolve')}catch(e){alert(e.message)}};
</script></body></html>
