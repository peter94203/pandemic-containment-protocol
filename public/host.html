<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主持人控制台｜P.A.N.D.E.M.I.C.</title><link rel="stylesheet" href="/style.css"></head><body>
<main class="app"><header class="top"><div><p class="eyebrow">HOST CONSOLE</p><h1>P.A.N.D.E.M.I.C. 收容協議</h1></div><p class="status" id="notice"></p></header>
<section class="host-controls"><button class="btn" id="start">開啟下一回合市場</button><button class="btn danger" id="reset">重置整場遊戲</button></section>
<p class="host-note">每回合會同時公開 A～E 五個市場。全員送出決策後，系統自動結算：有申請者的樣本依優先順序收容；無人申請的樣本保留、全員各扣 1 點，並累積進拒絕池。全部五張樣本售出後，再開啟下一回合。</p>
<div class="grid"><section><h2>公開收容市場</h2><div class="markets" id="markets"></div></section><aside class="panel rankings"><h2>即時安全排名</h2><div id="ranking"></div></aside></div></main>
<script src="/app.js"></script><script>
const notice=$('#notice'),markets=$('#markets'),ranking=$('#ranking');
const startButton=$('#start'),resetButton=$('#reset');
watch(s=>{notice.textContent=s.notice;renderMarkets(s,markets);renderRanking(s,ranking)});
async function hostPost(path){let key=localStorage.getItem('pandemic-host-key');if(!key){key=prompt('請輸入主持人密鑰');if(!key)return;localStorage.setItem('pandemic-host-key',key)}return post(path,{}, {'X-Host-Key':key})}
startButton.onclick=async()=>{try{await hostPost('/api/host/start')}catch(e){if(e.message.includes('密鑰'))localStorage.removeItem('pandemic-host-key');alert(e.message)}};
resetButton.onclick=async()=>{if(!confirm('確定重置所有樣本與隔離點數？'))return;try{await hostPost('/api/host/reset')}catch(e){if(e.message.includes('密鑰'))localStorage.removeItem('pandemic-host-key');alert(e.message)}};
</script></body></html>
