<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主持人控制台｜P.A.N.D.E.M.I.C.</title><link rel="stylesheet" href="/style.css"></head><body><main class="app"><header class="top"><div><p class="eyebrow">HOST CONSOLE</p><h1>P.A.N.D.E.M.I.C. 收容協議</h1></div><p class="status" id="notice"></p></header><section class="host-controls"><button class="btn" id="start">啟動下一輪市場</button><button class="btn secondary" id="end">結算本回合</button><button class="btn danger" id="reset">重置整場遊戲</button></section><p class="host-note">啟動後系統會隨機分配市場並同時開出樣本。每個市場依序進行拒絕／收容；所有市場結束後，按「結算本回合」再開始下一輪。</p><div class="grid"><section><h2>收容市場</h2><div class="markets" id="markets"></div></section><aside class="panel rankings"><h2>即時風險排名</h2><div id="ranking"></div></aside></div></main><script src="/app.js"></script><script>const notice=$('#notice'),markets=$('#markets'),ranking=$('#ranking');watch(s=>{notice.textContent=s.notice;renderMarkets(s,markets);renderRanking(s,ranking)});async function hostPost(path){let key=localStorage.getItem('pandemic-host-key');if(!key){key=prompt('請輸入主持人密鑰');if(!key)return;localStorage.setItem('pandemic-host-key',key)}return post(path,{}, {'X-Host-Key':key})}for(const [id,path] of [['start','/api/host/start'],['end','/api/host/end'],['reset','/api/host/reset']])document.getElementById(id).onclick=async()=>{if(id==='reset'&&!confirm('確定重置所有樣本與資源？'))return;try{await hostPost(path)}catch(e){if(e.message.includes('密鑰'))localStorage.removeItem('pandemic-host-key');alert(e.message)}};</script></body></html>
